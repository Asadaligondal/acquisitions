name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
          JWT_SECRET: test_jwt_secret_for_ci_cd_pipeline_testing_only
          ARCJET_KEY: test_arcjet_key
          ARCJET_ENV: development
        run: |
          echo "Running tests with coverage..."
          npm test
          echo "✅ Tests completed successfully!"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

      - name: Upload coverage to artifacts (detailed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-detailed
          path: |
            coverage/lcov-report/
            coverage/lcov.info
            coverage/coverage-final.json
          retention-days: 30

      - name: Generate test summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Try to extract coverage information
            if [ -f "coverage/coverage-summary.json" ]; then
              COVERAGE=$(node -e "
                const fs = require('fs');
                const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
                const total = coverage.total;
                console.log(\`📊 **Coverage Summary:**
          - Statements: \${total.statements.pct}%
          - Branches: \${total.branches.pct}%
          - Functions: \${total.functions.pct}%
          - Lines: \${total.lines.pct}%\`);
              " 2>/dev/null || echo "Coverage data not available")
              echo "$COVERAGE" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📁 **Artifacts uploaded:**" >> $GITHUB_STEP_SUMMARY
            echo "- Coverage reports (30 days retention)" >> $GITHUB_STEP_SUMMARY
            echo "- Detailed coverage HTML reports" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Possible causes:**" >> $GITHUB_STEP_SUMMARY
            echo "- Code syntax errors" >> $GITHUB_STEP_SUMMARY
            echo "- Test assertions failing" >> $GITHUB_STEP_SUMMARY
            echo "- Environment setup issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**How to debug:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Run \`npm test\` locally to reproduce" >> $GITHUB_STEP_SUMMARY
            echo "2. Check test output logs above" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure all dependencies are properly installed" >> $GITHUB_STEP_SUMMARY
            echo "4. Verify environment variables are set correctly" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Annotate test failures
        if: failure()
        run: |
          echo "::error title=Test Failure::One or more tests failed. Check the test output above for details."
          echo "::warning title=Debugging Help::Run 'npm test' locally to reproduce the issue."
