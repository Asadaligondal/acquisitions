name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          if ! npm run lint; then
            echo "❌ ESLint found issues!"
            echo "💡 Fix them with: npm run lint:fix"
            echo "::error title=ESLint Issues::ESLint found code quality issues. Run 'npm run lint:fix' to auto-fix them."
            exit 1
          fi
          echo "✅ ESLint passed!"

      - name: Run Prettier Format Check
        run: |
          echo "Running Prettier format check..."
          if ! npm run format:check; then
            echo "❌ Prettier found formatting issues!"
            echo "💡 Fix them with: npm run format"
            echo "::error title=Formatting Issues::Code formatting issues found. Run 'npm run format' to fix them."
            exit 1
          fi
          echo "✅ Prettier format check passed!"

      - name: Add workflow summary
        if: always()
        run: |
          echo "## 🔍 Lint and Format Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
            echo "- ESLint: ✅ No issues found" >> $GITHUB_STEP_SUMMARY
            echo "- Prettier: ✅ Code formatting is correct" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Issues found:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**How to fix:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Run \`npm run lint:fix\` to auto-fix ESLint issues" >> $GITHUB_STEP_SUMMARY
            echo "2. Run \`npm run format\` to fix formatting issues" >> $GITHUB_STEP_SUMMARY
            echo "3. Commit and push the changes" >> $GITHUB_STEP_SUMMARY
          fi